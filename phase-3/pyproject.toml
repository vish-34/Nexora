[project]
name = "coolneighbour-ai-engine"
version = "1.0.0"
description = "ThermoShield AI Microservice"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "networkx>=3.2.1",
  "numpy>=1.26.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "httpx>=0.27.0",
  "pytest>=8.0.0"
]

[tool.pyrefly]
search-path = [
  ".",
  "app",
  ".venv/Lib/site-packages"
]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [".", "app"]
